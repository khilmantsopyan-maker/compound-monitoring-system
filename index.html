<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>COMPOUND PREPARATION MONITORING</title>
  <!-- Style/CSS Anda di sini -->
</head>
<body>

  <!-- Seluruh tampilan HTML (Header, Grid Line, Modal, dll) ada di sini -->

  <!-- ================================================================= -->
  <!-- TEMPEL SCRIPT FIREBASE DARI SINI SAMPAI SEBELUM TAG </body> -->
  <!-- ================================================================= -->

  <!-- 1. Library Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script>
    // 2. Konfigurasi Firebase dari layar Anda tadi
    const firebaseConfig = {
      apiKey: "AIzaSyAc6HkXMsuB2wpYKbKHoYfuifdQVFykdHY",
      authDomain: "lokasi-system.firebaseapp.com",
      databaseURL: "https://lokasi-system-default-rtdb.firebaseio.com",
      projectId: "lokasi-system",
      storageBucket: "lokasi-system.firebasestorage.app",
      messagingSenderId: "106677338807",
      appId: "1:106677338807:web:87f73c81e13f9ee4ba0332",
      measurementId: "G-QS4LC1WLCM"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const slotsRef = database.ref('slots');

    // Mapping Line (Line 3 dilompati sesuai tampilan awal Anda)
    const lineMapping = [
      { line: 1, mc1: 1, mc2: 2, row: 'top' },
      { line: 2, mc1: 3, mc2: 4, row: 'top' },
      { line: 4, mc1: 5, mc2: 6, row: 'top' },
      { line: 5, mc1: 7, mc2: 8, row: 'top' },
      { line: 6, mc1: 9, mc2: 10, row: 'top' },
      { line: 7, mc1: 11, mc2: 12, row: 'top' },
      { line: 8, mc1: 13, mc2: 14, row: 'bottom' },
      { line: 9, mc1: 15, mc2: 16, row: 'bottom' },
      { line: 10, mc1: 17, mc2: 18, row: 'bottom' },
      { line: 11, mc1: 19, mc2: 20, row: 'bottom' },
      { line: 12, mc1: 21, mc2: 22, row: 'bottom' },
      { line: 13, mc1: 23, mc2: 24, row: 'bottom' }
    ];

    let slotsState = {};
    let activeSlotKey = null;

    function pad(num) { return String(num).padStart(2, '0'); }

    // Synchronize otomatis secara real-time dari Firebase
    slotsRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        slotsState = data;
      } else {
        initDefaultSlots();
      }
      renderBoard();
    });

    function initDefaultSlots() {
      lineMapping.forEach(item => {
        const m1 = pad(item.mc1);
        const m2 = pad(item.mc2);

        const slots = [
          { key: `L${item.line}-${m1}-A`, label: `${m1}-A`, mc: item.mc1, inj: '1' },
          { key: `L${item.line}-${m2}-A`, label: `${m2}-A`, mc: item.mc2, inj: '1' },
          { key: `L${item.line}-${m1}-b`, label: `${m1}-b`, mc: item.mc1, inj: '2' },
          { key: `L${item.line}-${m2}-B`, label: `${m2}-B`, mc: item.mc2, inj: '2' }
        ];

        slots.forEach(s => {
          slotsState[s.key] = {
            line: item.line,
            mesin: s.mc,
            inj: s.inj,
            label: s.label,
            isFilled: false,
            model: '',
            warna: '',
            qty: '',
            note: ''
          };
        });
      });
      slotsRef.set(slotsState);
    }

    function updateHeaderStats() {
      let grandTotalQty = 0;
      let activeSlotsCount = 0;
      const totalSlots = Object.keys(slotsState).length;

      Object.values(slotsState).forEach(slot => {
        if (slot.isFilled) {
          activeSlotsCount++;
          grandTotalQty += parseFloat(slot.qty) || 0;
        }
      });

      const totalQtyEl = document.getElementById('globalTotalQty');
      const activeSlotsEl = document.getElementById('globalActiveSlots');
      if (totalQtyEl) totalQtyEl.innerText = `${grandTotalQty.toLocaleString('id-ID')} Kg`;
      if (activeSlotsEl) activeSlotsEl.innerText = `${activeSlotsCount} / ${totalSlots}`;
    }

    function renderBoard() {
      const topContainer = document.getElementById('topRow');
      const bottomContainer = document.getElementById('bottomRow');
      if (!topContainer || !bottomContainer) return;

      topContainer.innerHTML = '';
      bottomContainer.innerHTML = '';

      lineMapping.forEach(item => {
        const m1 = pad(item.mc1);
        const m2 = pad(item.mc2);
        const slotKeys = [
          `L${item.line}-${m1}-A`,
          `L${item.line}-${m2}-A`,
          `L${item.line}-${m1}-b`,
          `L${item.line}-${m2}-B`
        ];

        let slotsHTML = '';
        slotKeys.forEach(key => {
          const slot = slotsState[key] || { label: 'N/A', isFilled: false, qty: '' };
          const filledClass = slot.isFilled ? 'filled' : '';
          const subInfoHTML = slot.isFilled ? `<div class="sub-info">${slot.qty}Kg</div>` : '';

          slotsHTML += `
            <div class="slot-box ${filledClass}" onclick="openModal('${key}')">
              ${slot.label}
              ${subInfoHTML}
            </div>
          `;
        });

        const lineCard = document.createElement('div');
        lineCard.className = 'line-card';

        if (item.row === 'top') {
          lineCard.innerHTML = `<div class="line-title top">Line ${item.line}</div><div class="slots-grid">${slotsHTML}</div>`;
          topContainer.appendChild(lineCard);
        } else {
          lineCard.innerHTML = `<div class="slots-grid">${slotsHTML}</div><div class="line-title bottom">Line ${item.line}</div>`;
          bottomContainer.appendChild(lineCard);
        }
      });

      updateHeaderStats();
    }

    // Fungsi Simpan Inputan Ke Firebase
    function saveCurrentSlot() {
      if (!activeSlotKey) return;

      const modelInput = document.getElementById('modalModel');
      const warnaInput = document.getElementById('modalWarna');
      const qtyInput = document.getElementById('modalQty');

      const modelVal = modelInput.value.trim();
      const warnaVal = warnaInput.value.trim();
      const qtyVal = qtyInput.value.trim();

      let isValid = true;
      if (!modelVal) { modelInput.classList.add('input-error'); isValid = false; }
      if (!warnaVal) { warnaInput.classList.add('input-error'); isValid = false; }
      if (!qtyVal || parseFloat(qtyVal) <= 0) { qtyInput.classList.add('input-error'); isValid = false; }

      if (!isValid) {
        alert("Harap isi semua field wajib (Model, Color, dan Qty)!");
        return;
      }

      const updatedData = {
        ...slotsState[activeSlotKey],
        isFilled: true,
        model: modelVal,
        warna: warnaVal,
        qty: qtyVal,
        note: document.getElementById('modalNote').value.trim() || '-'
      };

      database.ref(`slots/${activeSlotKey}`).update(updatedData)
        .then(() => closeModal())
        .catch((err) => alert("Gagal menyimpan ke Firebase: " + err.message));
    }

    // Fungsi Ambil Material / Kosongkan Slot di Firebase
    function actionTakeMaterial() {
      if (!activeSlotKey) return;
      const slot = slotsState[activeSlotKey];
      if (!slot || !slot.isFilled) return;

      const emptyData = {
        ...slot,
        isFilled: false,
        model: '',
        warna: '',
        qty: '',
        note: ''
      };

      database.ref(`slots/${activeSlotKey}`).update(emptyData)
        .then(() => closeModal())
        .catch((err) => alert("Gagal mengupdate Firebase: " + err.message));
    }

    function openModal(key) {
      activeSlotKey = key;
      const slot = slotsState[key];
      if (!slot) return;

      document.getElementById('modalLocationBadge').innerText = 
        `LINE ${slot.line} — MACHINE ${pad(slot.mesin)} — INJECTOR ${slot.inj} (${slot.label})`;

      const statusTag = document.getElementById('summaryStatus');
      if (slot.isFilled) {
        statusTag.innerText = 'READY';
        statusTag.className = 'status-tag filled';
        document.getElementById('summaryModel').innerText = slot.model || '-';
        document.getElementById('summaryWarna').innerText = slot.warna || '-';
        document.getElementById('summaryQty').innerText = `${slot.qty} Kg`;
        document.getElementById('summaryNote').innerText = slot.note || '-';
      } else {
        statusTag.innerText = 'EMPTY';
        statusTag.className = 'status-tag empty';
        document.getElementById('summaryModel').innerText = '-';
        document.getElementById('summaryWarna').innerText = '-';
        document.getElementById('summaryQty').innerText = '-';
        document.getElementById('summaryNote').innerText = '-';
      }

      document.getElementById('modalModel').value = slot.model || '';
      document.getElementById('modalWarna').value = slot.warna || '';
      document.getElementById('modalQty').value = slot.qty || '';
      document.getElementById('modalNote').value = slot.note || '';

      clearFormErrors();
      showMenuView();
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      activeSlotKey = null;
    }

    function showMenuView() {
      document.getElementById('modalTitle').innerText = 'LOCATION DETAILS';
      document.getElementById('viewMenu').style.display = 'flex';
      document.getElementById('viewForm').style.display = 'none';
    }

    function showFormView() {
      document.getElementById('modalTitle').innerText = 'INPUT / UPDATE FORM';
      document.getElementById('viewMenu').style.display = 'none';
      document.getElementById('viewForm').style.display = 'flex';
    }

    function removeError(element) { element.classList.remove('input-error'); }
    function clearFormErrors() {
      document.getElementById('modalModel').classList.remove('input-error');
      document.getElementById('modalWarna').classList.remove('input-error');
      document.getElementById('modalQty').classList.remove('input-error');
    }

    function openInventorySummary() {
      const summaryMap = {};
      Object.values(slotsState).forEach(slot => {
        if (slot.isFilled) {
          const key = `${slot.model.trim().toUpperCase()}___${slot.warna.trim().toUpperCase()}`;
          const qty = parseFloat(slot.qty) || 0;

          if (!summaryMap[key]) {
            summaryMap[key] = { model: slot.model, color: slot.warna, totalQty: 0, slotsCount: 0 };
          }
          summaryMap[key].totalQty += qty;
          summaryMap[key].slotsCount += 1;
        }
      });

      const tbody = document.getElementById('summaryTableBody');
      if (tbody) {
        tbody.innerHTML = '';
        const items = Object.values(summaryMap);
        if (items.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding: 20px;">No materials stored.</td></tr>`;
        } else {
          items.forEach(item => {
            tbody.innerHTML += `
              <tr>
                <td><strong>${item.model}</strong></td>
                <td>${item.color}</td>
                <td class="slots-col">${item.slotsCount}</td>
                <td class="qty-col">${item.totalQty.toLocaleString('id-ID')} Kg</td>
              </tr>
            `;
          });
        }
      }
      document.getElementById('summaryModalOverlay').classList.add('active');
    }

    function closeSummaryModal() {
      document.getElementById('summaryModalOverlay').classList.remove('active');
    }
  </script>
</body>
</html>
